<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; overflow: hidden; background: #e9e9e6; }
      #root { width: 100%; height: 100%; position: relative; background: #e9e9e6; }
      #tela { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; }
      #hud { position: absolute; left: 24px; top: 20px; font-family: "Segoe UI", sans-serif; font-size: 22px; color: #151515; }
      #hud .q { display: inline-block; width: 14px; height: 14px; margin-right: 8px; }
      #hud div { margin-top: 6px; }
    </style>
  </head>
  <body>
    <!-- Exemplo mínimo do kit/gps no HyperFrames: a cena é a mesma do Remotion (assets/kit/gps/exemplo/cena_exemplo.js).
         1280x720, 60 q/s, 4 s. Rode "node preparar.mjs" antes (monta assets/). -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-fps="60" data-width="1280" data-height="720">
      <canvas id="tela" width="1280" height="720"></canvas>
      <div id="hud"></div>
    </div>
    <script>
      (function () {
        var relogio = { t: 0 };
        var host = { relogio: relogio, desenhar: null };
        window.__exemploGps = host;
        window.__hf = window.__hf || {};
        window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady["main"] = new Promise(function (r) { host.pronto = r; });
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });
        tl.to(relogio, { t: 4, duration: 4, ease: "none", onUpdate: function () { if (host.desenhar) host.desenhar(relogio.t); } }, 0);
        window.__timelines["main"] = tl;
      })();
    </script>
    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.169.0/+esm";
      import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/loaders/GLTFLoader.js/+esm";
      import { montarCena, EXEMPLO } from "./assets/kit/gps/exemplo/cena_exemplo.js";
      const host = window.__exemploGps;
      const CARRO = { Ferrari: "assets/ferrari_sf26.glb", Mercedes: "assets/2026_mercedes_w17.glb" };
      const voltas = await Promise.all(EXEMPLO.voltas.map((v) => fetch(`assets/kit/gps/voltas/${v}.json`).then((r) => r.json())));
      const ld = new GLTFLoader();
      const [pista, ...carros] = await Promise.all([ld.loadAsync("assets/interlagos_sao_paulo.glb"), ...voltas.map((v) => ld.loadAsync(CARRO[v.equipe]))]);
      const cena = montarCena(THREE, {
        canvas: document.getElementById("tela"), largura: 1280, altura: 720, pista: pista.scene,
        carros: carros.map((c, i) => ({ cena: c.scene, volta: voltas[i] })),
      });
      const hud = document.getElementById("hud");
      host.desenhar = (t) => {
        const h = cena.desenhar(t);
        const q = Math.round(t * 60);
        hud.innerHTML = `<b>HYPERFRAMES</b> · kit/gps · GPS OpenF1 · tempo real · quadro ${q}` +
          h.map((x) => `<div><span class="q" style="background:${x.cor}"></span>${x.sigla} ${x.kmh} km/h · t volta ${x.t.toFixed(2)} s</div>`).join("");
      };
      host.desenhar(host.relogio.t);
      host.pronto();
    </script>
  </body>
</html>
