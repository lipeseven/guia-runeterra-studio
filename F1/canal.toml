# Perfil do canal Explicando F1. Tudo que é só deste canal fica nesta pasta (caminhos relativos à raiz do projeto).
chave = "f1"
nome = "Explicando F1"
porta = 8766
assunto = "Fórmula 1: história, pilotos, equipes, corridas e bastidores"
personagens_de = "Fórmula 1 (pilotos, chefes de equipe e equipes)"
exemplo_secao = '"Ayrton Senna.", "O Acidente de Imola."'
fatos = "f1"                                # fontes da conferência de fatos (Wikipedia em inglês)
aviso_legal = "f1"
exemplo_titulo = "A Maior Rivalidade da Fórmula 1 Explicada em 12 minutos"
glossario = "Fórmula 1, Grand Prix, pit stop, DRS, FIA, Interlagos, Mônaco, Monza, Senna, Prost, Schumacher, Hamilton, Verstappen"
formatos = ["horizontal", "vertical", "horizontal_doc"]   # o card escolhe ao nascer: horizontal = animado v1; vertical = curto animado; horizontal_doc = documentário (motor documental)
sfx = ["clique", "seletor", "radio", "whoosh", "pop", "alerta"]   # efeitos sonoros do canal (tools/audio/sfx.py)

[vertical]                                  # animação do vídeo vertical: projeto Remotion do canal + catálogo do diretor
projeto = "F1/video"
composicao = "Vertical"
fps = 60                                    # igual ao Root.tsx (VERTICAL_FPS); tempos das cenas sempre em segundos
catalogo = "catalogo_vertical.md"           # em F1/docs; a 1ª coluna da tabela = tipos válidos

[horizontal]                                # vídeo longo animado (F1/docs/folha_horizontal.md): sua voz gravada + diretor do horizontal
projeto = "F1/video"
composicao = "Horizontal"
api = "api_horizontal.md"                  # em F1/docs
modelo = "sonnet"                          # modelo do diretor (opus custa mais cota)
modelos = "F1/dados/modelos3d"             # .glb do acervo 3D (entram por link na pasta pública do render)
carro = "ferrari_sf26.glb"                # carro padrão do estúdio

[horizontal_doc]                            # documentário horizontal (F1/horizontal/): História ★ → SPEC ★ → Ativos → Verificação → Rascunho ★
diretor = "F1/horizontal/diretor"          # o painel chama a ponte painel.py daqui; estado em <projeto>/horizontal/estado.json
rotulo = "documentário"                    # nome do formato no botão do quadro

[pastas]
acervo = 'C:\Users\Felipe\Downloads\canais\catálogo F1'   # pasta do Felipe (só leitura)
dados_acervo = "F1/dados/acervo"            # banco, miniaturas, índices CLIP, tomadas, derivados
banco_acervo = "F1/dados/acervo.db"
internet = "F1/dados/acervo_internet"       # mídias baixadas da internet
projetos = "F1/dados/projetos"
studio = "F1/dados/studio.db"
docs = "F1/docs"                            # regras_de_direcao.md, estilo_roteiro.md, guia_de_estilo.md
referencias = "F1/dados/referencias"        # vídeos dos canais de referência
analise = "F1/dados/analise_referencias"
